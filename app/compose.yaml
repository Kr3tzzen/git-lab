services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8080:8080"
    command: /bin/sh -c "sed -i 's/80/8080/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

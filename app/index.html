<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab Docker Compose</title>
</head>
<body>
    <h1>Лабораторная работа: Docker Compose</h1>
    <button onclick="loadData()">Получить данные с бэкенда</button>
    <h2 id="result" style="color: green;"></h2>

    <script>
        async function loadData() {
            try {
                const response = await fetch('http://' + window.location.hostname + ':8000/api/data');
                const data = await response.json();
                document.getElementById('result').innerText = data.message;
            } catch (err) {
                document.getElementById('result').innerText = 'Ошибка подключения к бэкенду';
            }
        }
    </script>
</body>
</html>
